<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="instgram.style.css">
    </head>
    <body>
        <div class="left">
            <div class="logo">
                <img src="insta icon.png" alt="">

            </div>
        <div class="images">
            <img src="instgram.01.png" alt="" id="img1">
            <img src="instgram.com2.png" alt="" id="img2">
            <img src="instgram 2.png" alt="" id="img3">
        </div>
        <div class="caption">
            <p>
                See everyday moments from your <strong>close friends.</strong>
            </p>
        </div>
        </div>
    

    <div class="right">
    <div class="box">

        <h2>Log in to Instagram</h2>

        <input type="text" placeholder="Mobile number, username or email address">

        <input type="password" placeholder="Password">
        <input type="button" value="Log in">
        <div class="forget">
            <input type="button" value="Forgotten password">
        </div>
        <div class="log">
            <input type="button" value="Log in with facebook">
        </div>
        <div class="create">
            <input type="button" value="create new account">

        </div>
    </div>
</div>
        
    </body>
</html>
