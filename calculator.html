<!DOCTYPE html>
<html>
    <head>
        <style>
            *{
                margin:  0px;
                padding: 0px;
            }
            body{
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
            }
            .container{
                width:200px;
                height:350px;
                /*border:1px solid black;*/
                box-sizing: border-box;
            }
            .container input[type=text]{
                width:100%;
                height: 8vh;
                box-sizing: border-box;
            }
            .button{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;

            }
            .container .button button{
                height:7.5vh;
            }
            .container .button .spl1{
                grid-column: 1/3;
            }
            .container .button .spl2{
                grid-column: 3/5;
            }
            .container .button button:hover{
                height:7.5vh;
                background-color: black;
                color: white;
                font-size:large;
            }
            .container .button button:active{
                background-color: yellow;
            }
                


        </style>

    </head>
    <body>
        <div class="container">
            <input type="text">
            <div class="button">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>0</button>
                <button>+</button>
                <button>-</button>
                <button>%</button>
                <button>*</button>
                <button>/</button>
                <button>=</button>
                <button class="spl1">AC</button>
                <button class="spl2">DEL</button>

            </div>
        </div>
    </body>
</html>
